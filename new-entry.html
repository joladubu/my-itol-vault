<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create a new personal journal entry in ITOL Vault."
    />
    <title>New Entry | ITOL Vault</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>

<header class="site-header">
  <a class="brand" href="index.html">ITOL Vault</a>

  <button
    class="menu-toggle"
    id="menuToggle"
    type="button"
    aria-label="Open navigation menu"
    aria-expanded="false"
    aria-controls="mainNavigation"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="mainNavigation" aria-label="Main navigation">
    <a href="index.html">Journal</a>
    <a href="vault.html">Vault</a>
    <a href="new-entry.html" aria-current="page">New Entry</a>
  </nav>
</header>


    <main class="container">
      <section class="intro">
        <p class="eyebrow">YOUR PERSONAL SPACE</p>
        <h1>New Entry</h1>
        <p>Take a moment to capture your thoughts and reflections.</p>
      </section>

      <section aria-labelledby="entry-form-heading">
        <h2 id="entry-form-heading">What's on your mind?</h2>

        <form id="entryForm">
          <p class="entry-date" id="entryDate"></p>

          <div class="form-field">
            <label for="entryTitle">Entry title</label>
            <input
              type="text"
              id="entryTitle"
              name="title"
              placeholder="Untitled Reflection"
              required
            />
          </div>

          <div class="form-field">
            <label for="entryBody">Your reflection</label>
            <textarea
              id="entryBody"
              name="body"
              rows="12"
              placeholder="Begin your reflection..."
              required
            ></textarea>
          </div>

          <div class="form-actions">
            <a class="secondary-button" href="index.html">Discard</a>

            <button class="primary-button" id="saveEntryButton" type="submit">
              Save Entry
            </button>
          </div>

          <p id="formMessage" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>ITOL Vault — A space to reflect and grow.</p>
    </footer>
  </body>
</html>
